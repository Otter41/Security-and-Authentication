name: SafeVault security tests
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run security tests
        run: dotnet test SafeVault.Tests/SafeVault.Tests.csproj --configuration Release --verbosity normal
